<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
</head>
<body>
    <form>
        <fieldset>
            <legend>Formulario</legend>
            <label for="documento">Tipo Documento</label>
            <select id="documento" name="documento">
                <option value="ci">Cédula Identidad</option>
            </select><br><br>

            <label for="nombre">Nombres:</label>
            <input type="text" id="nombre" name="nombre"><br><br>

            <label for="apellido">Apellidos:</label>
            <input type="text" id="apellido" name="apellido"><br><br>

            <label>Género:</label><br>
            <input type="radio" id="masculino" name="genero" value="masculino">
            <label for="masculino">Masculino</label><br>
            <input type="radio" id="femenino" name="genero" value="femenino">
            <label for="femenino">Femenino</label><br><br>

            <label for="descripcion">Descripción</label><br>
            <textarea id="descripcion" name="descripcion" rows="4" cols="40">Tecnología Web I.</textarea><br><br>

            <input type="submit" value="Cargar Información">
        </fieldset>
    </form>
</body>
</html>
